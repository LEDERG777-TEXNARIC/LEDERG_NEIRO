name: Test and deploy LEDERG NEIRO
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Restore ONNX Runtime assets for cached worker versions
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.22.0-dev.20250409-89f8206ba4"
          mkdir -p /tmp/ort-package vendor/onnxruntime
          TARBALL="$(npm pack --silent "onnxruntime-web@${VERSION}" --pack-destination /tmp/ort-package)"
          tar -tzf "/tmp/ort-package/${TARBALL}" | grep -E '^package/dist/ort-wasm-simd-threaded(\\.jsep)?[.](wasm|mjs) | while IFS= read -r entry; do
            name="${entry##*/}"
            tar -xOf "/tmp/ort-package/${TARBALL}" "${entry}" > "vendor/onnxruntime/${name}"
          done
          test -s vendor/onnxruntime/ort-wasm-simd-threaded.jsep.wasm
          test -s vendor/onnxruntime/ort-wasm-simd-threaded.jsep.mjs
          test -s vendor/onnxruntime/ort-wasm-simd-threaded.wasm
          test -s vendor/onnxruntime/ort-wasm-simd-threaded.mjs
          echo "Compatibility ONNX Runtime assets are ready:"
          ls -lh vendor/onnxruntime/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
 | while IFS= read -r entry; do
            name="${entry##*/}"
            tar -xOf "/tmp/ort-package/${TARBALL}" "${entry}" > "vendor/onnxruntime/${name}"
          done
          test -s vendor/onnxruntime/ort-wasm-simd-threaded.jsep.wasm
          test -s vendor/onnxruntime/ort-wasm-simd-threaded.jsep.mjs
          test -s vendor/onnxruntime/ort-wasm-simd-threaded.wasm
          echo "Compatibility ONNX Runtime assets are ready:"
          ls -lh vendor/onnxruntime/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
